name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Bei PRs alte Läufe abbrechen, auf main nie (sonst bricht ein Deployment mittendrin ab).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typcheck, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Die API-Tests laufen gegen eine echte Datenbank.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haushalt
          POSTGRES_PASSWORD: ci-passwort
          POSTGRES_DB: haushalt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haushalt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: haushalt
      POSTGRES_PASSWORD: ci-passwort
      POSTGRES_DB: haushalt
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/einrichten

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typcheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Caddy prüfen: ohne Einträge anderer Apps (leeres Volume) und mit einem
      # Beispiel-Eintrag, wie ihn eine App ins Volume caddy-sites legt.
      - name: Caddyfile prüfen
        run: |
          sites=$(mktemp -d)
          pruefen() {
            docker run --rm -e DOMAIN=example.org \
              -v "$PWD/infra/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$sites:/etc/caddy/sites:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          pruefen
          printf 'beispiel.example.org {\n\treverse_proxy beispiel-web:80\n}\n' > "$sites/beispiel.caddy"
          pruefen

  e2e:
    name: E2E (Offline-Sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/einrichten

      - name: .env mit zufälligen Werten anlegen
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^POWERSYNC_ADMIN_TOKEN=.*/POWERSYNC_ADMIN_TOKEN=$(openssl rand -hex 16)/" \
              -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" \
              .env.example > .env

      - name: Postgres und PowerSync starten
        run: docker compose up -d --wait

      - name: Playwright-Browser installieren
        run: pnpm --filter @haushalt/web exec playwright install --with-deps chromium

      - name: E2E-Tests
        run: pnpm --filter @haushalt/web test:e2e

      - name: Logs bei Fehlern
        if: failure()
        run: docker compose logs --tail 200

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-ergebnisse
          path: apps/web/test-results
          retention-days: 7

  image:
    name: Docker-Image bauen
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auf Server ausrollen
    needs: image
    # Erst aktiv, wenn in den Repo-Einstellungen die Variable DEPLOY_HOST gesetzt ist
    # (Anleitung: docs/betrieb.md).
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: produktion
      url: https://${{ vars.DEPLOY_DOMAIN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Neue Version starten
        env:
          ZIEL: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy "$ZIEL" \
            IMAGE="$IMAGE" REGISTRY_TOKEN="$REGISTRY_TOKEN" REGISTRY_USER="$REGISTRY_USER" \
            'bash -s' <<'SKRIPT'
          set -euo pipefail
          cd ~/haushalt-app
          # Stand der PowerSync-Konfiguration vorher merken: Sie ist als Datei eingebunden,
          # Änderungen (z. B. neue Sync-Tabellen) greifen erst nach einem Neustart.
          SYNC_VORHER=$(git rev-parse HEAD:infra/powersync 2>/dev/null || true)
          CADDY_VORHER=$(git rev-parse HEAD:infra/production/Caddyfile 2>/dev/null || true)
          git fetch --quiet origin main && git reset --quiet --hard origin/main
          SYNC_NACHHER=$(git rev-parse HEAD:infra/powersync)
          CADDY_NACHHER=$(git rev-parse HEAD:infra/production/Caddyfile)
          cd infra/production
          # Gemeinsames Netz und Volume für die Einträge anderer Apps (Stammtisch-ADR 0024).
          docker network inspect edge >/dev/null 2>&1 || docker network create edge
          docker volume inspect caddy-sites >/dev/null 2>&1 || docker volume create caddy-sites >/dev/null
          # Neues Caddyfile samt Einträgen der Apps prüfen, bevor Caddy neu startet: Eine
          # doppelte Domain oder ein kaputter Eintrag ließe sonst alle Seiten ausfallen.
          # Schlägt das fehl, läuft der alte Caddy unverändert weiter.
          docker run --rm -e DOMAIN="$(grep -E '^DOMAIN=' .env | cut -d= -f2 | tr -d '"')" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v caddy-sites:/etc/caddy/sites:ro \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          APP_IMAGE="$IMAGE" docker compose pull app
          APP_IMAGE="$IMAGE" docker compose up -d --wait
          # Erst nach dem Start der App (sie spielt die Migrationen ein) neu starten.
          if [ "$SYNC_VORHER" != "$SYNC_NACHHER" ]; then
            echo "PowerSync-Konfiguration geändert – Neustart"
            APP_IMAGE="$IMAGE" docker compose restart powersync
          fi
          # Das Caddyfile ist ebenfalls eingebunden – nach Änderungen neu einlesen.
          if [ "$CADDY_VORHER" != "$CADDY_NACHHER" ]; then
            echo "Caddyfile geändert – Neustart"
            APP_IMAGE="$IMAGE" docker compose restart caddy
          fi
          # Antwortet wirklich unsere App? (Nicht nur „Container läuft“.)
          for i in $(seq 1 10); do
            curl -fsS -m 5 "https://$(grep -E '^DOMAIN=' .env | cut -d= -f2 | tr -d '"')/api/health" | grep -q '"ok":true' && break
            [ "$i" = 10 ] && { echo "Health-Check fehlgeschlagen"; exit 1; }
            sleep 3
          done
          docker logout ghcr.io
          docker image prune -f
          SKRIPT
