# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Konfiguration des PowerSync-Dienstes (lokale Entwicklung).
# `!env NAME` setzt Umgebungsvariablen ein; erlaubt sind nur Namen mit Präfix PS_.
# Doku: https://docs.powersync.com/self-hosting

telemetry:
  disable_telemetry_sharing: true

# Quelle: unsere App-Datenbank, Änderungen kommen per logischer Replikation.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

# Ablage für den Sync-Zustand: eigene Datenbank im selben Postgres.
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

# Wer darf sich verbinden? Clients schicken ein JWT, das mit diesem Schlüssel
# signiert ist. Vorläufig ein symmetrischer Entwicklungsschlüssel; mit Better Auth
# (Schritt 6) wechseln wir auf jwks_uri des API.
client_auth:
  audience: ["powersync"]
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: haushalt-dev
        k: !env PS_JWT_SECRET

# Token für die Admin-API des Dienstes (Diagnose).
api:
  tokens:
    - !env PS_ADMIN_TOKEN
