# Produktion: alles auf einem Server.
#   caddy     → HTTPS (Let's Encrypt), leitet /powersync an PowerSync, den Rest an die App
#   app       → API + Frontend (Image aus der GitHub Container Registry)
#   postgres  → Datenbank (nicht von außen erreichbar)
#   powersync → Sync-Dienst (nur über Caddy erreichbar)
#
# Start auf dem Server: docker compose up -d   (Werte in .env, Vorlage: .env.example)
#
# Eigenes Netz „intern“ mit eindeutigen Namen (haushalt-app, haushalt-postgres …):
# Hängt ein anderes Projekt auf demselben Server einen Container in unser Netz, der
# ebenfalls „app“ heißt, verteilte Docker die Anfragen sonst zufällig auf beide –
# die API lieferte dann die fremde Seite (Oktober 2026).

name: haushalt-prod

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # vszw-proxy: nur Caddy hängt zusätzlich im Netz des Spiel-Sync-Servers
    # („Vom Samen zum Wald“, Container vszw-sync). Der Sync-Server sieht so weder
    # Postgres noch die App. Das Netz legt dessen deploy/setup.sh an – es muss
    # existieren, bevor dieser Stand ausgerollt wird.
    networks: [intern, vszw-proxy, tee-proxy, stammtisch-proxy]
    depends_on:
      - app
      - powersync

  app:
    image: ${APP_IMAGE:-ghcr.io/j4nric/haushalt-app:latest}
    restart: unless-stopped
    networks:
      intern:
        aliases: [haushalt-app]
    environment:
      POSTGRES_HOST: haushalt-postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      WEB_URL: https://${DOMAIN}
      # Konten mit Admin-Panel (kommagetrennt), z. B. ADMIN_EMAILS=jan@example.de
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Push-Benachrichtigungen; ohne Schlüssel gibt es keine (siehe docs/betrieb.md).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    networks:
      intern:
        aliases: [haushalt-postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:1.27.0
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    networks:
      intern:
        aliases: [haushalt-powersync]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: "8080"
      PS_DATA_SOURCE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@haushalt-postgres:5432/${POSTGRES_DB}
      PS_STORAGE_SOURCE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@haushalt-postgres:5432/powersync_storage
      PS_JWKS_URL: http://haushalt-app:3000/api/auth/jwks
      PS_ADMIN_TOKEN: ${POWERSYNC_ADMIN_TOKEN}
    volumes:
      - ../powersync:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

networks:
  intern:
    name: haushalt-prod-intern
  vszw-proxy:
    name: vszw-proxy
    external: true
  # Netz der Tee-Etiketten-App (sticker-plot); nur Caddy hängt zusätzlich darin.
  # Muss vor dem Deploy existieren: docker network create tee-proxy
  tee-proxy:
    name: tee-proxy
    external: true
  # Netz des Spiels Stammtisch (j4nric/skat-roguelite); nur Caddy hängt zusätzlich darin.
  # Muss vor dem Deploy existieren: docker network create stammtisch-proxy
  stammtisch-proxy:
    name: stammtisch-proxy
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
