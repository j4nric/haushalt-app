# Produktion: alles auf einem Server.
#   caddy     → HTTPS (Let's Encrypt), leitet /powersync an PowerSync, den Rest an die App
#   app       → API + Frontend (Image aus der GitHub Container Registry)
#   postgres  → Datenbank (nicht von außen erreichbar)
#   powersync → Sync-Dienst (nur über Caddy erreichbar)
#
# Start auf dem Server: docker compose up -d   (Werte in .env, Vorlage: .env.example)

name: haushalt-prod

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - powersync

  app:
    image: ${APP_IMAGE:-ghcr.io/j4nric/haushalt-app:latest}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      WEB_URL: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:1.27.0
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: "8080"
      PS_DATA_SOURCE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PS_STORAGE_SOURCE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/powersync_storage
      PS_JWKS_URL: http://app:3000/api/auth/jwks
      PS_ADMIN_TOKEN: ${POWERSYNC_ADMIN_TOKEN}
    volumes:
      - ../powersync:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
