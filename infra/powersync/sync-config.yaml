# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Legt fest, welche Daten auf welche Geräte synchronisiert werden.
# Änderungen erfordern einen Neustart: docker compose restart powersync
# Doku: https://docs.powersync.com/sync/streams/overview

config:
  edition: 3

streams:
  # Alles aus den Haushalten, in denen der angemeldete Nutzer Mitglied ist.
  # auth.user_id() ist die Nutzer-ID aus dem Token (sub).
  haushalt:
    auto_subscribe: true
    queries:
      - SELECT * FROM haushalte
        WHERE id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM haushalt_mitglieder
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM artikel
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM listeneintraege
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM vorratsbuchungen
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM kaeufe
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM rezepte
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM rezept_zutaten
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM gekocht
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
      - SELECT * FROM plan_eintraege
        WHERE haushalt_id IN (SELECT haushalt_id FROM haushalt_mitglieder WHERE nutzer_id = auth.user_id())
