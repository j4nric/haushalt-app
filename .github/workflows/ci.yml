name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typcheck, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Die API-Tests laufen gegen eine echte Datenbank.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haushalt
          POSTGRES_PASSWORD: ci-passwort
          POSTGRES_DB: haushalt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haushalt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: haushalt
      POSTGRES_PASSWORD: ci-passwort
      POSTGRES_DB: haushalt
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Die mit Node 24 gelieferte Corepack-Version kann pnpm 12 nicht starten.
      - name: pnpm über Corepack aktivieren
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      - name: pnpm-Cache-Pfad ermitteln
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typcheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
