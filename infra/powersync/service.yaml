# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Konfiguration des PowerSync-Dienstes (lokale Entwicklung).
# `!env NAME` setzt Umgebungsvariablen ein; erlaubt sind nur Namen mit Präfix PS_.
# Doku: https://docs.powersync.com/self-hosting

telemetry:
  disable_telemetry_sharing: true

# Quelle: unsere App-Datenbank, Änderungen kommen per logischer Replikation.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

# Ablage für den Sync-Zustand: eigene Datenbank im selben Postgres.
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

# Wer darf sich verbinden? Clients schicken ein JWT von Better Auth (GET /api/auth/token).
# PowerSync prüft die Signatur mit den öffentlichen Schlüsseln des API (JWKS).
client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync"]

# Token für die Admin-API des Dienstes (Diagnose).
api:
  tokens:
    - !env PS_ADMIN_TOKEN
